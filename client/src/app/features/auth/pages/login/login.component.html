<section class="login-shell" aria-labelledby="login-title">
  <div class="staff-mark" aria-hidden="true">
    <span>♪</span>
    <span>♫</span>
    <span>♩</span>
    <span>♬</span>
    <span>♪</span>
  </div>

  <div class="login-content">
    <div class="brand" aria-label="Acordes y Letras">
      <img src="assets/localchurch-brand/logo-localchurch.png" alt="">
      <span>Local <strong>Music</strong></span>
    </div>

    <div class="intro">
      <p class="welcome">Tu espacio musical</p>
      <h1 id="login-title">Qué bueno tenerte de vuelta.</h1>
      <p class="description">Inicia sesión para crear y organizar canciones.</p>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        [(ngModel)]="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required>

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required>

      @if (errorMessage) {
        <p class="form-error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isSubmitting || !username.trim() || !password">
        {{ isSubmitting ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="private-note"><span aria-hidden="true">●</span> Acceso privado para el administrador</p>
  </div>
</section>
