<aside class="rail" aria-label="Navegación del estudio">
  <a class="rail-brand" routerLink="/" aria-label="Acordes y Letras — ir al inicio">
    <img src="assets/localchurch-brand/logo-localchurch.png" alt="" aria-hidden="true" />
  </a>

  <span class="rail-spine" aria-hidden="true"></span>

  <nav class="rail-nav" aria-label="Secciones del estudio">
    <span class="rail-cursor" [style.--i]="activeIndex()" aria-hidden="true"></span>

    @for (item of items; track item.path; let i = $index) {
      <a
        class="rail-item"
        [class.is-active]="activeIndex() === i"
        [routerLink]="item.path"
        [attr.aria-current]="activeIndex() === i ? 'page' : null"
        [title]="item.label"
      >
        <span class="rail-icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('home') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10.7 12 4l8 6.7V19a1.4 1.4 0 0 1-1.4 1.4h-3.9V14H9.3v6.4H5.4A1.4 1.4 0 0 1 4 19v-8.3Z" />
              </svg>
            }
            @case ('play') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.4" />
                <path d="M10.2 8.6 15.6 12l-5.4 3.4V8.6Z" />
              </svg>
            }
            @case ('edit') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.6h4.1L19.4 8.3a2.2 2.2 0 0 0 0-3.1l-1.6-1.6a2.2 2.2 0 0 0-3.1 0L3.4 15v4.6Z" />
                <path d="m13.6 4.8 5.6 5.6" />
              </svg>
            }
            @case ('tempo') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.4 3.6h5.2l4.6 16.8H4.8L9.4 3.6Z" />
                <path d="M12 8.2v7.4" />
                <path d="m8 11.4 4-1.9" />
              </svg>
            }
            @case ('daw') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6.5h16M4 12h16M4 17.5h16" />
                <circle cx="9" cy="6.5" r="2.1" fill="currentColor" stroke="none" />
                <circle cx="15.5" cy="12" r="2.1" fill="currentColor" stroke="none" />
                <circle cx="8" cy="17.5" r="2.1" fill="currentColor" stroke="none" />
              </svg>
            }
          }
        </span>
        <span class="rail-label">{{ item.short }}</span>
      </a>
    }
  </nav>

  <div class="rail-foot">
    <button class="rail-action" type="button" (click)="openPalette()" title="Buscar sección (Ctrl + K)"
      aria-label="Buscar sección">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.4" />
        <path d="m16 16 4 4" />
      </svg>
      <span>Buscar</span>
    </button>

    <button class="rail-action rail-logout" type="button" (click)="logout()" title="Cerrar sesión"
      aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 4.5h-8A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5h8" />
        <path d="M16.5 8.5 20 12l-3.5 3.5M20 12h-8" />
      </svg>
      <span>Salir</span>
    </button>

    <span class="rail-version" aria-hidden="true">v2.0</span>
  </div>
</aside>
